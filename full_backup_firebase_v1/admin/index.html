<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAWJ Admin Login</title>
    <!-- Use main styles for variable/font consistency, but we'll override for layout -->
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            /* Light clean background */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            /* Soft, premium shadow */
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .admin-logo {
            width: 80px;
            margin-bottom: 1.5rem;
            /* High-precision filter for #0177BF from White */
            filter: invert(32%) sepia(74%) saturate(2657%) hue-rotate(187deg) brightness(91%) contrast(101%);
        }

        h1 {
            font-family: 'Guilty Treasure', sans-serif;
            color: #0177BF;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #475569;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            box-sizing: border-box;
            /* Important for padding */
        }

        input:focus {
            border-color: #0177BF;
            box-shadow: 0 0 0 3px rgba(1, 119, 191, 0.1);
        }

        button.btn-login {
            width: 100%;
            padding: 1rem;
            background-color: #0177BF;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        button.btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(1, 119, 191, 0.2);
            background-color: #01629c;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <!-- Logo -->
        <img src="../MAWJ_white.png" alt="Mawj Logo" class="admin-logo">

        <h1>MAWJ</h1>
        <p class="subtitle">Admin Access</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
            <div id="error-msg" class="error-message">Invalid credentials</div>
        </form>
    </div>

    <script src="login.js"></script>
</body>

</html>
