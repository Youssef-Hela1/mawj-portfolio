<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" fill="none" stroke="#0177BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top Left: Red shape (Semicircle pointing left) -->
  <path d="M12 6H6a6 6 0 1 0 0 12h6V6z"/>
  <!-- Top Right: Orange shape (Semicircle pointing right) -->
  <path d="M12 6h6a6 6 0 1 0 0 12h-6V6z"/>
