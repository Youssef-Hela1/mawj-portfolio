  <path d="M12 18H6a6 6 0 1 0 0 12h6V18z"/>
  <!-- Middle Right: Blue shape (Circle) -->
  <circle cx="18" cy="24" r="6"/>
  <!-- Bottom Left: Green shape (Teardrop pointing left/down) -->
  <path d="M12 30H6a6 6 0 0 0 0 0 6 6 0 0 1 6 6V30z" />
  <!-- Correct Teardrop: actually starts at 12,30. Goes down to 12,36. Curves up to 6,30. -->
